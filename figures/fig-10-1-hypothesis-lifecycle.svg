<svg viewBox="0 0 600 245" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="10" y="24" width="130" height="72" rx="6" fill="#dbe5fb" stroke="#1a5276" stroke-width="1.8"/>
  <text x="75" y="52" text-anchor="middle" font-size="14" font-weight="700" fill="#1a5276">1. Proposed</text>
  <text x="75" y="76" text-anchor="middle" font-size="14" fill="#222">Needs approval</text>

  <line x1="140" y1="60" x2="176" y2="60" stroke="#5e35b1" stroke-width="2.2"/>
  <polygon points="176,60 168,55 168,65" fill="#5e35b1"/>
  <text x="158" y="48" text-anchor="middle" font-size="14" font-weight="700" fill="#5e35b1">Gate 1</text>

  <rect x="178" y="24" width="144" height="72" rx="6" fill="#e0f2f1" stroke="#00695c" stroke-width="1.8"/>
  <text x="250" y="52" text-anchor="middle" font-size="14" font-weight="700" fill="#00695c">2. Approved</text>
  <text x="250" y="76" text-anchor="middle" font-size="14" fill="#222">Attach Runs &amp; Cite</text>

  <line x1="322" y1="60" x2="358" y2="60" stroke="#1a5276" stroke-width="2.2"/>
  <polygon points="358,60 350,55 350,65" fill="#1a5276"/>

  <rect x="360" y="24" width="136" height="72" rx="6" fill="#ede7f6" stroke="#5e35b1" stroke-width="1.8"/>
  <text x="428" y="52" text-anchor="middle" font-size="14" font-weight="700" fill="#5e35b1">3. In Review</text>
  <text x="428" y="76" text-anchor="middle" font-size="14" fill="#222">Needs acceptance</text>

  <line x1="496" y1="60" x2="526" y2="60" stroke="#2e7d32" stroke-width="2.2"/>
  <polygon points="526,60 518,55 518,65" fill="#2e7d32"/>

  <rect x="528" y="24" width="64" height="72" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="560" y="52" text-anchor="middle" font-size="14" font-weight="700" fill="#2e7d32">4. OK</text>
  <text x="560" y="76" text-anchor="middle" font-size="14" fill="#222">Sealed</text>

  <rect x="10" y="124" width="582" height="104" rx="6" fill="#f7f9fb" stroke="#334155" stroke-width="1.6"/>
  <text x="24" y="152" font-size="14" font-weight="700" fill="#1a5276">Evidence Snapshot &amp; Human Gate Rules:</text>
  <text x="24" y="178" font-size="14" fill="#222">1. Citing a file or value records its MD5 hash and number at citation time.</text>
  <text x="24" y="204" font-size="14" fill="#5e35b1">2. Gate 1 (Approve) and Gate 2 (Accept) require a human decision in the GUI.</text>
</svg>
