<svg viewBox="0 0 600 240" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="12" y="20" width="174" height="196" rx="6" fill="#dbe5fb" stroke="#1a5276" stroke-width="1.8"/>
  <text x="99" y="48" text-anchor="middle" font-size="15" font-weight="700" fill="#1a5276">1. Instrument File</text>
  <text x="99" y="80" text-anchor="middle" font-size="14" fill="#222">.fibps / .mit / .zrw</text>
  <text x="99" y="106" text-anchor="middle" font-size="14" fill="#222">.depo.json / .xrcx</text>
  <text x="99" y="148" text-anchor="middle" font-size="14" fill="#334155">Original stays</text>
  <text x="99" y="170" text-anchor="middle" font-size="14" fill="#334155">untouched on disk</text>

  <line x1="186" y1="118" x2="214" y2="118" stroke="#1a5276" stroke-width="2.2"/>
  <polygon points="214,118 206,113 206,123" fill="#1a5276"/>

  <rect x="216" y="20" width="174" height="196" rx="6" fill="#e0f2f1" stroke="#00695c" stroke-width="1.8"/>
  <text x="303" y="48" text-anchor="middle" font-size="15" font-weight="700" fill="#00695c">2. Stored Bytes</text>
  <text x="303" y="80" text-anchor="middle" font-size="14" font-weight="600" fill="#222">Notebook Storage</text>
  <text x="303" y="106" text-anchor="middle" font-size="14" fill="#222">MD5 hash + version</text>
  <text x="303" y="148" text-anchor="middle" font-size="14" fill="#00695c">Shared regions (.fibps)</text>
  <text x="303" y="170" text-anchor="middle" font-size="14" fill="#00695c">Shared interval (.zrw)</text>

  <line x1="390" y1="95" x2="418" y2="95" stroke="#334155" stroke-width="2"/>
  <polygon points="418,95 410,90 410,100" fill="#334155"/>
  <line x1="418" y1="145" x2="390" y2="145" stroke="#00695c" stroke-width="2"/>
  <polygon points="390,145 398,140 398,150" fill="#00695c"/>

  <rect x="420" y="20" width="168" height="196" rx="6" fill="#f7f9fb" stroke="#334155" stroke-width="1.8"/>
  <text x="504" y="48" text-anchor="middle" font-size="15" font-weight="700" fill="#222">3. Working Draft</text>
  <text x="504" y="80" text-anchor="middle" font-size="14" fill="#334155">External app or</text>
  <text x="504" y="104" text-anchor="middle" font-size="14" fill="#334155">Markdown editor</text>
  <text x="504" y="146" text-anchor="middle" font-size="14" font-weight="600" fill="#00695c">Save Working Draft</text>
  <text x="504" y="170" text-anchor="middle" font-size="14" fill="#c62828">or Reload to discard</text>
</svg>
