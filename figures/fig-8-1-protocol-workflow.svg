  <text x="261" y="88" text-anchor="middle" font-size="14" fill="#222">Read-only in queue</text>

  <line x1="332" y1="54" x2="394" y2="54" stroke="#2e7d32" stroke-width="2.2"/>
  <polygon points="394,54 386,49 386,59" fill="#2e7d32"/>
  <text x="363" y="44" text-anchor="middle" font-size="14" font-weight="600" fill="#2e7d32">Approve</text>

  <rect x="396" y="18" width="188" height="68" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="490" y="46" text-anchor="middle" font-size="15" font-weight="700" fill="#2e7d32">Approved (Locked)</text>
  <text x="490" y="70" text-anchor="middle" font-size="14" fill="#222">Final read-only record</text>

  <line x1="332" y1="90" x2="394" y2="148" stroke="#c62828" stroke-width="2.2"/>
  <polygon points="394,148 385,146 390,138" fill="#c62828"/>
  <text x="345" y="138" font-size="14" font-weight="600" fill="#c62828">Reject</text>

  <rect x="396" y="122" width="188" height="74" rx="6" fill="#fdecea" stroke="#c62828" stroke-width="2"/>
  <text x="490" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#c62828">Rejected (+ Reason)</text>
  <text x="490" y="174" text-anchor="middle" font-size="14" fill="#222">Return to Draft to fix</text>

  <path d="M 396 172 H 78 V 110" fill="none" stroke="#c62828" stroke-width="1.8" stroke-dasharray="5 4"/>
  <polygon points="78,110 73,118 83,118" fill="#c62828"/>
