<svg viewBox="0 0 600 250" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="8" y="20" width="128" height="82" rx="6" fill="#dbe5fb" stroke="#1a5276" stroke-width="1.8"/>
  <text x="72" y="46" text-anchor="middle" font-size="14" font-weight="700" fill="#1a5276">1. Draft</text>
  <text x="72" y="68" text-anchor="middle" font-size="13" fill="#222">Proposed</text>
  <text x="72" y="88" text-anchor="middle" font-size="13" fill="#455a64">Edit &amp; Ref</text>

  <line x1="136" y1="60" x2="174" y2="60" stroke="#5e35b1" stroke-width="2.2"/>
  <polygon points="174,60 166,55 166,65" fill="#5e35b1"/>
  <text x="155" y="48" text-anchor="middle" font-size="13" font-weight="700" fill="#5e35b1">Gate 1</text>

  <rect x="176" y="20" width="144" height="82" rx="6" fill="#e0f2f1" stroke="#00695c" stroke-width="1.8"/>
  <text x="248" y="46" text-anchor="middle" font-size="14" font-weight="700" fill="#00695c">2. Open</text>
  <text x="248" y="68" text-anchor="middle" font-size="13" fill="#222">Approved</text>
  <text x="248" y="88" text-anchor="middle" font-size="13" fill="#004d40">Runs &amp; Cite</text>

  <line x1="320" y1="60" x2="356" y2="60" stroke="#1a5276" stroke-width="2.2"/>
  <polygon points="356,60 348,55 348,65" fill="#1a5276"/>

  <rect x="358" y="20" width="136" height="82" rx="6" fill="#ede7f6" stroke="#5e35b1" stroke-width="1.8"/>
  <text x="426" y="46" text-anchor="middle" font-size="14" font-weight="700" fill="#5e35b1">3. Review</text>
  <text x="426" y="68" text-anchor="middle" font-size="13" fill="#222">In review</text>
  <text x="426" y="88" text-anchor="middle" font-size="13" fill="#311b92">Gate 2</text>

  <line x1="494" y1="60" x2="522" y2="60" stroke="#2e7d32" stroke-width="2.2"/>
  <polygon points="522,60 514,55 514,65" fill="#2e7d32"/>

  <rect x="524" y="20" width="68" height="82" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="558" y="46" text-anchor="middle" font-size="14" font-weight="700" fill="#2e7d32">4. Closed</text>
  <text x="558" y="68" text-anchor="middle" font-size="13" fill="#222">Accepted</text>
  <text x="558" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#2e7d32">Sealed</text>

  <rect x="8" y="120" width="584" height="114" rx="6" fill="#f7f9fb" stroke="#334155" stroke-width="1.6"/>
  <text x="22" y="146" font-size="14" font-weight="700" fill="#1a5276">Standalone Hypotheses Window &amp; Review Rules:</text>
  <text x="22" y="172" font-size="13.5" fill="#222">1. Citing a file or value snapshots its MD5 hash and number (Planned refused).</text>
  <text x="22" y="196" font-size="13.5" fill="#00695c">2. Community: you start and close your own hypotheses (Draft → Open → Closed).</text>
  <text x="22" y="220" font-size="13.5" fill="#5e35b1">3. Team Lab: a reviewer approves proposals (Gate 1) and accepts conclusions (Gate 2).</text>
</svg>
