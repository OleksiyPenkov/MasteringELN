<svg viewBox="0 0 600 235" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="10" y="12" width="280" height="210" rx="6" fill="#f7f9fb" stroke="#1a5276" stroke-width="1.8"/>
  <text x="24" y="38" font-size="15" font-weight="700" fill="#1a5276">Tools &gt; Analysis... (Correlation)</text>
  <text x="24" y="68" font-size="14" fill="#222">X Axis: Procedure Condition</text>
  <text x="36" y="92" font-size="14" fill="#334155">(e.g. PowerBN or Bias on Proc)</text>
  <text x="24" y="122" font-size="14" fill="#222">Y Axis: Mean of Child Results</text>
  <text x="36" y="146" font-size="14" fill="#334155">(e.g. Hardness or COF on Actions)</text>
  <text x="24" y="182" font-size="14" font-weight="600" fill="#00695c">Linear regression + Copy Data (CSV)</text>

  <rect x="308" y="12" width="282" height="210" rx="6" fill="#e0f2f1" stroke="#00695c" stroke-width="1.8"/>
  <text x="322" y="38" font-size="15" font-weight="700" fill="#00695c">File &gt; Export Report... (PDF)</text>
  <text x="322" y="68" font-size="14" fill="#222">Select Procedure root in Item Tree</text>
  <text x="322" y="96" font-size="14" fill="#222">Check sections: Metadata, Protocols,</text>
  <text x="322" y="120" font-size="14" fill="#222">Values, Files, Tags, Signatures</text>
  <text x="322" y="152" font-size="14" fill="#334155">Preview in HTML Viewer -&gt; Export PDF</text>
  <text x="322" y="186" font-size="14" font-weight="600" fill="#c62828">Readable report, not a full backup</text>
</svg>
