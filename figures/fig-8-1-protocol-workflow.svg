<svg viewBox="0 0 600 220" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="14" y="34" width="128" height="74" rx="6" fill="#dbe5fb" stroke="#1a5276" stroke-width="2"/>
  <text x="78" y="64" text-anchor="middle" font-size="15" font-weight="700" fill="#1a5276">Draft</text>
  <text x="78" y="88" text-anchor="middle" font-size="14" fill="#222">Author edits form</text>

  <line x1="142" y1="71" x2="188" y2="71" stroke="#1a5276" stroke-width="2.2"/>
  <polygon points="188,71 180,66 180,76" fill="#1a5276"/>

  <rect x="190" y="34" width="142" height="74" rx="6" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
